spring.application.name=job-service

server.port=8081


# ======================
# DATABASE
# ======================

spring.datasource.url=jdbc:mysql://mysql:3306/jobs?createDatabaseIfNotExist=true

spring.datasource.username=root
spring.datasource.password=root

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ======================
# JPA
# ======================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# ======================
# EUREKA
# ======================

eureka.client.register-with-eureka=true

eureka.client.fetch-registry=true

eureka.client.serviceUrl.defaultZone=http://eureka:8761/eureka/


# ======================
# ZIPKIN
# ======================

management.tracing.sampling.probability=1.0

management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans


# ======================
# KAFKA
# ======================

spring.kafka.bootstrap-servers=kafka:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer


# ======================
# REDIS
# ======================

spring.data.redis.host=redis

spring.data.redis.port=6379

spring.cache.type=redis


# ======================
# LOGGING
# ======================

logging.level.org.springframework=INFO

# =========================
# ACTUATOR HEALTH
# =========================

management.health.circuitbreakers.enabled=true


# =========================
# EXPOSE ACTUATOR ENDPOINTS
# =========================

management.endpoints.web.exposure.include=health


# =========================
# HEALTH DETAILS
# =========================

management.endpoint.health.show-details=always


# =========================
# RESILIENCE4J CIRCUIT BREAKER
# =========================

resilience4j.circuitbreaker.instances.CompanyandRatingBreaker.registerHealthIndicator=true

resilience4j.circuitbreaker.instances.CompanyandRatingBreaker.eventConsumerBufferSize=10

resilience4j.circuitbreaker.instances.CompanyandRatingBreaker.failureRateThreshold=50

resilience4j.circuitbreaker.instances.CompanyandRatingBreaker.minimumNumberOfCalls=5

resilience4j.circuitbreaker.instances.CompanyandRatingBreaker.automaticTransitionFromOpenToHalfOpenEnabled=true

resilience4j.circuitbreaker.instances.CompanyandRatingBreaker.waitDurationInOpenState=6s

resilience4j.circuitbreaker.instances.CompanyandRatingBreaker.permittedNumberOfCallsInHalfOpenState=3

resilience4j.circuitbreaker.instances.CompanyandRatingBreaker.slidingWindowSize=10

resilience4j.circuitbreaker.instances.CompanyandRatingBreaker.slidingWindowType=COUNT_BASED